name: VVL (AArch64 Linux Build)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:

env:
  CMAKE_GENERATOR: Ninja

permissions:
  contents: read

jobs:
  build-aarch64-linux:
    runs-on: ubuntu-24.04-arm
    if: "!contains(github.head_ref || github.ref, 'SKIP-CI')"
    name: "Linux aarch64 (glibc, Release)"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-aarch64-glibc-release

      - name: Install system dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y libwayland-dev xorg-dev ninja-build

      - name: Cache external dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/external
          key: linux-aarch64-dependencies-release-${{ hashFiles('scripts/known_good.json') }}

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -D CMAKE_BUILD_TYPE=Release \
            -D UPDATE_DEPS=ON \
            -D UPDATE_DEPS_SKIP_EXISTING_INSTALL=ON \
            -D UPDATE_DEPS_DIR=${{ github.workspace }}/external \
            -D BUILD_TESTS=OFF \
            -D BUILD_WERROR=OFF
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Install and Strip
        run: cmake --install build --prefix ${{ github.workspace }}/install --strip

      - name: Upload AArch64 Validation Layer Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Validation_Layers_Linux_aarch64
          path: |
            ${{ github.workspace }}/install/lib/libVkLayer_khronos_validation.so
            ${{ github.workspace }}/install/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json
          retention-days: 7
